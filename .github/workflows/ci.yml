name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (library + examples)
        run: npm run typecheck
      - name: Build the package
        run: npm run build
      - name: Render one still per example
        run: npm run stills
      - uses: actions/upload-artifact@v4
        with:
          name: stills
          path: out/stills/
